name: mantra_application
description: "adalah aplikasi Flutter untuk mengenalkan kuliner tradisional Indonesia kepada generasi muda dengan foto, deskripsi, dan cerita asal-usulnya."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  package_info_plus: ^9.0.0
  provider: ^6.1.5+1
  flutter_svg: ^2.2.1
  http: ^1.5.0
  flutter_dotenv: ^6.0.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/image/
    - .env

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/image/appbar-logo.png
  android: true
  ios: true
  web: false

  color_dark: "#121212"
  image_dark: assets/image/appbar-logo.png

  android_12:
    image: assets/image/appbar-logo.png
    color: "#FFFFFF"
